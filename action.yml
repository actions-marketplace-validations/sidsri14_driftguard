name: 'DriftGuard CI Guard'
description: 'Fast, local-first CI guard for environment drift, secret leaks, and AI prompt contract regressions.'
author: 'Siddharth Srivastava'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  version:
    description: 'DriftGuard release version to run'
    required: false
    default: 'v1'
  since:
    description: 'Git revision/branch to diff against (e.g. origin/main)'
    required: false
    default: ''
  env-scope:
    description: 'Scope for environment scans: changed, staged, or all'
    required: false
    default: 'changed'
  comment-pr:
    description: 'Post or update PR sticky comment with markdown report'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for PR commenting'
    required: false
    default: ${{ github.token }}
  fail-on-violation:
    description: 'Fail step if drift or prompt contract violations exist'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Download DriftGuard binary
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if [ "$RUNNER_OS" = "Linux" ]; then
          ASSET="driftguard-linux-x86_64"
        elif [ "$RUNNER_OS" = "macOS" ]; then
          ASSET="driftguard-macos-aarch64"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          ASSET="driftguard-windows-x86_64.exe"
        else
          echo "Unsupported OS: $RUNNER_OS"
          exit 1
        fi

        BIN_DIR="$RUNNER_TEMP/driftguard-bin"
        mkdir -p "$BIN_DIR"
        URL="https://github.com/sidsri14/driftguard/releases/download/${VERSION}/${ASSET}"
        echo "Downloading DriftGuard binary from $URL..."
        curl -sSL -f -o "$BIN_DIR/driftguard" "$URL" || {
          echo "Prebuilt binary download failed, compiling from cargo..."
          cargo install --git https://github.com/sidsri14/driftguard --tag "${VERSION}" --locked --root "$RUNNER_TEMP/cargo_install"
          cp "$RUNNER_TEMP/cargo_install/bin/driftguard" "$BIN_DIR/driftguard"
        }
        chmod +x "$BIN_DIR/driftguard"
        echo "$BIN_DIR" >> "$GITHUB_PATH"

    - name: Run DriftGuard Check
      id: driftguard_check
      shell: bash
      run: |
        CMD="driftguard check --markdown"
        SINCE_FLAG=""
        if [ -n "${{ inputs.since }}" ]; then
          SINCE_FLAG="--since ${{ inputs.since }}"
        elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          SINCE_FLAG="--since origin/$GITHUB_BASE_REF"
        fi

        SCOPE="${{ inputs.env-scope }}"
        if [ -n "$SINCE_FLAG" ]; then
          CMD="$CMD $SINCE_FLAG"
          if [ -n "$SCOPE" ]; then
            CMD="$CMD --env-scope $SCOPE"
          fi
        else
          if [ "$SCOPE" = "changed" ]; then
            CMD="$CMD --env-scope all"
          elif [ -n "$SCOPE" ]; then
            CMD="$CMD --env-scope $SCOPE"
          fi
        fi

        echo "Executing: $CMD"
        set +e
        $CMD > driftguard-report.md 2>&1
        STATUS=$?
        echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
        cat driftguard-report.md
        exit 0

    - name: Comment PR report
      if: inputs.comment-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- driftguard-report -->';
          if (!fs.existsSync('driftguard-report.md')) return;
          const report = fs.readFileSync('driftguard-report.md', 'utf8');
          const body = `${marker}\n${report}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
          const existing = comments.data.find(c => c.user.type === 'Bot' && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Fail on DriftGuard violations
      if: inputs.fail-on-violation == 'true' && steps.driftguard_check.outputs.exit_code != '0'
      shell: bash
      run: |
        echo "DriftGuard detected violations (exit code ${{ steps.driftguard_check.outputs.exit_code }})."
        exit 1
